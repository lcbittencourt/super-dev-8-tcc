<div class="sistema">
  <header class="barra-superior">
    <div class="marca">
      <div class="simbolo-marca">P</div>

      <div>
        <strong>Pulso<span>.</span></strong>
      </div>
    </div>

    <span class="etiqueta-perfil">{{ titulo }}</span>

    <nav class="navegacao">
      <a routerLink="/admin">Admin</a>
      <a routerLink="/gestor">Gestor</a>
      <a routerLink="/colaborador">Colaborador</a>
    </nav>

    <div class="identificacao">{{ empresa.logo }}</div>
  </header>

  <main class="pagina">
    <section class="cabecalho-pagina">
      <div>
        <h1>{{ titulo }}</h1>
        <p>{{ empresa.nome }} · {{ empresa.cidade }}</p>
      </div>
    </section>

    <section class="indicadores">
      <article class="indicador">
        <span>Registros cadastrados</span>
        <strong>{{ totalRegistros }}</strong>
        <small>Dados da empresa selecionada</small>
      </article>
    </section>

    <section class="cartao">
      <div class="cabecalho-cartao">
        <div>
          <h2>{{ titulo }}</h2>
          <p>{{ descricao }}</p>
        </div>
      </div>

      <div class="estado-vazio">
        Nenhum registro cadastrado para {{ empresa.nome }}.
      </div>
    </section>
  </main>
</div>
