<main class="pagina-login">
  <section class="painel-login">
    <div class="marca-login">
      <div class="simbolo-marca">P</div>
      <strong>Pulso<span>.</span></strong>
    </div>

    <div class="cabecalho-login">
      <h1>Acesso ao sistema</h1>
      <p>Entre com seu usuário para continuar</p>
    </div>

    <form class="formulario-login" (ngSubmit)="entrar()">
      <label>
        Login
        <input
          type="text"
          name="login"
          autocomplete="username"
          [(ngModel)]="login"
        >
      </label>

      <label>
        Senha
        <div class="campo-senha">
          <input
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            autocomplete="current-password"
            [(ngModel)]="senha"
          >

          <button
            class="botao-visualizar-senha"
            type="button"
            (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Visualizar senha'"
            [title]="mostrarSenha ? 'Ocultar senha' : 'Visualizar senha'"
          >
            @if (mostrarSenha) {
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 5.09A9.4 9.4 0 0 1 12 5c6.5 0 10 7 10 7a13.3 13.3 0 0 1-1.9 2.79" /><path d="M6.53 6.53A13.13 13.13 0 0 0 2 12s3.5 7 10 7a9.5 9.5 0 0 0 4.47-1.12" /><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" /><path d="M2 2l20 20" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
            }
          </button>
        </div>
      </label>

      @if (mensagem) {
        <div class="mensagem-erro">
          {{ mensagem }}
        </div>
      }

      <button class="botao principal" type="submit">Entrar</button>
    </form>
  </section>
</main>
