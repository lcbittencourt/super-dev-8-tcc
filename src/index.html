<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pulso</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <script>
    (function () {
      try {
        if (localStorage.getItem('temaPulso') === 'escuro') {
          document.documentElement.setAttribute('data-tema', 'escuro');
        }
      } catch (erro) {}
    })();
  </script>
</body>
</html>
